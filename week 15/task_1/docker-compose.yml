version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - VLLM_API_BASE=http://ollama:11434/v1
    volumes:
      - .:/app:z
      - ./chroma_db:/app/chroma_db:z
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama:z

  # Sidecar container to automatically pull the small model for Ollama
  ollama-pull:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=ollama:11434
    command: pull qwen2.5:0.5b
    depends_on:
      - ollama
