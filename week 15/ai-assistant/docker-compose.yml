version: '3.8'

services:
  ai-assistant:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Optionally mount local source code for development
      # - ./app:/app/app
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
