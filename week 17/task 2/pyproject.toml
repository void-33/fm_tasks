[project]
name = "week17-track-b"
version = "0.1.0"
description = "Track B: Agentic AI MLOps - Cross-source Verification Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.1",
    "uvicorn[standard]>=0.29.0",
    "google-genai>=0.2.2",
    "openai>=1.14.3",
    "tenacity>=8.2.3",
    "slowapi>=0.1.9",
    "redis[asyncio]>=5.0.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "PyPDF2>=3.0.1",
    "chromadb>=0.4.24",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mlflow>=2.14.0",
    "evidently>=0.4.30",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
