[project]
name = "week17-track-a"
version = "0.1.0"
description = "Track A: Data Science MLOps - Telco Churn"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.14.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "evidently>=0.4.30,<0.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.1",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
